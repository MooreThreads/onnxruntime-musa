name: musa-model-zoo

on:
  pull_request:
  schedule:
    # 01:00 Asia/Shanghai. GitHub cron is UTC and may start late under load.
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: musa-gpu-0-${{ github.workflow }}
  cancel-in-progress: false

env:
  MUSA_VISIBLE_DEVICES: "0"
  MUSA_HOME: /usr/local/musa
  MODEL_ZOO_SRC: /data/albert/Projects/onnx-model-zoo
  PLUGIN_SO_NAME: libonnxruntime_providers_musa_plugin.so

jobs:
  unit:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, musa, s5000]
    timeout-minutes: 90
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
          fetch-depth: 1

      - name: Init ONNX Runtime submodule
        run: bash scripts/init_onnxruntime_submodule.sh

      - name: Provider unit tests
        run: bash test/run_all.sh

  model-zoo-pr:
    name: model-zoo (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, musa, s5000]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: head
            ref: ${{ github.event.pull_request.head.sha }}
          - name: base
            ref: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout ${{ matrix.name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          submodules: false
          fetch-depth: 1

      - name: Init ONNX Runtime submodule
        run: bash scripts/init_onnxruntime_submodule.sh

      - name: Build plugin .so
        run: ./build.sh --clean --no-wheel

      - name: Run model zoo with this .so
        run: |
          set -euo pipefail
          plugin="${GITHUB_WORKSPACE}/build/Release/${PLUGIN_SO_NAME}"
          test -f "${plugin}"
          sha256sum "${plugin}"
          git rev-parse HEAD

          zoo="${RUNNER_TEMP}/onnx-model-zoo"
          rm -rf "${zoo}"
          cp -a "${MODEL_ZOO_SRC}" "${zoo}"

          export MUSA_EP_LIBRARY="${plugin}"
          export LD_LIBRARY_PATH="${MUSA_HOME}/lib:${MUSA_HOME}/lib64:${LD_LIBRARY_PATH:-}"
          cd "${zoo}"
          bash run_all_onnx.sh --ep musa -s 4 -q 10

      - name: Upload model zoo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-zoo-${{ matrix.name }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/onnx-model-zoo/error_logs/
            ${{ runner.temp }}/onnx-model-zoo/musa_ep_performance.md
          if-no-files-found: ignore
          retention-days: 14

  model-zoo-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, musa, s5000]
    timeout-minutes: 720
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          submodules: false
          fetch-depth: 1

      - name: Init ONNX Runtime submodule
        run: bash scripts/init_onnxruntime_submodule.sh

      - name: Build plugin .so
        run: ./build.sh --clean --no-wheel

      - name: Run full model zoo regression
        run: |
          set -euo pipefail
          plugin="${GITHUB_WORKSPACE}/build/Release/${PLUGIN_SO_NAME}"
          test -f "${plugin}"
          sha256sum "${plugin}"
          git rev-parse HEAD

          zoo="${RUNNER_TEMP}/onnx-model-zoo"
          rm -rf "${zoo}"
          cp -a "${MODEL_ZOO_SRC}" "${zoo}"

          export MUSA_EP_LIBRARY="${plugin}"
          export LD_LIBRARY_PATH="${MUSA_HOME}/lib:${MUSA_HOME}/lib64:${LD_LIBRARY_PATH:-}"
          cd "${zoo}"
          bash run_all_onnx.sh

      - name: Upload nightly logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-zoo-nightly-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/onnx-model-zoo/error_logs/
            ${{ runner.temp }}/onnx-model-zoo/musa_ep_performance.md
          if-no-files-found: ignore
          retention-days: 14
